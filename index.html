<title>ספריית חדר הלמידה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap">
<style id="css">
/* Layout: a soft beige header with the illustrated logo, a row of subject chips, then a grid of worksheet "sheets": each card reads like a printed A4 page with a colored subject tab and the brand tree in the corner. Single light theme on purpose: the logo artwork is dark ink on light paper. */
:root{
  color-scheme:light;
  --bg:#F7F1EF; --paper:#ffffff; --beige:#F4EAE6; --ink:#564A3A; --muted:#7F7262; --line:#E8DCD5; --rule:#F1E8E3;
  --teal:#44676D; --teal-ink:#ffffff;
  --mint:#B1D8D1; --pink:#F2CAC7; --lilac:#9EA4D3; --sand:#D3B07B; --lilac-soft:#D5D8EE; --sand-soft:#EBDABE; --teal-soft:#C2D5D7;
  --danger:#A8483F; --ok:#3B6B5A;
  --f:"Assistant","Arial Hebrew",Arial,system-ui,sans-serif;
}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.6}
#app{min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f);text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}

.top{background:var(--beige);border-bottom:1px solid var(--line)}
.top .wrap{padding-block:28px 30px;display:grid;gap:12px}
.logo{display:block;width:min(300px,78%);height:auto;margin-bottom:6px}
.top h1{font-size:clamp(34px,6.5vw,54px);line-height:1.1;font-weight:300;color:var(--teal);letter-spacing:.01em;display:flex;align-items:flex-start;gap:10px}
.top h1 .heart{width:clamp(18px,2.4vw,24px);height:auto;margin-top:2px}
.intro{max-width:58ch;margin:0;white-space:pre-line}
.toprow{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin-top:8px}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:4px 16px}
.search input{border:0;background:transparent;flex:1;min-width:0;padding:8px 0;outline:none}
.search svg{flex:none;color:var(--teal)}
.count{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}

.chips{display:flex;gap:8px;overflow-x:auto;padding-block:20px 6px;scrollbar-width:thin}
.chip{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 15px;cursor:pointer;font-size:16px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.chip .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:7px;vertical-align:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px;padding-block:18px 52px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.page{aspect-ratio:4/3;max-width:100%;position:relative;overflow:hidden;border-bottom:1px solid var(--line);
  background:var(--paper) repeating-linear-gradient(to bottom,transparent 0 29px,var(--rule) 29px 30px)}
.page.has-cover{background:var(--beige);display:grid;place-items:center;padding:16px 0 0}
.page img.cover{height:100%;width:auto;max-width:100%;object-fit:contain;display:block;background:#fff;box-shadow:0 1px 3px rgba(86,74,58,.18),0 6px 16px rgba(86,74,58,.10);border-radius:2px;transform:translateY(6%)}
.page .ph{position:absolute;inset:0;display:grid;place-items:center;padding:30px 26px 22px;text-align:center;font-size:23px;font-weight:600;line-height:1.3;color:var(--teal)}
.page .tree{width:62px;height:auto;opacity:.95}
.tab{position:absolute;top:0;inset-inline-start:16px;background:var(--c);color:var(--ink);font-size:14px;font-weight:600;padding:3px 13px 5px;border-radius:0 0 10px 10px}
.new{position:absolute;top:10px;inset-inline-end:10px;background:var(--pink);color:var(--ink);font-size:13px;font-weight:700;padding:1px 10px;border-radius:999px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.body h3{font-size:20px;line-height:1.3;font-weight:700}
.body p{margin:0;color:var(--muted);font-size:16px}
.meta{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:auto;padding-top:8px}
.meta span+span::before{content:"·";margin-inline-end:10px}
.dl{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;background:var(--teal);color:var(--teal-ink);text-decoration:none;border-radius:999px;padding:10px 14px;font-weight:600}
.dl:hover{background:#3a5a5f}
.dl[aria-disabled="true"]{opacity:.5;pointer-events:none}
.adminrow{display:flex;gap:8px;margin-top:8px}
.ghost{flex:1;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 10px;cursor:pointer;font-size:15px}
.ghost.warn{color:var(--danger);border-color:currentColor}

.empty{grid-column:1/-1;text-align:center;padding:52px 16px;color:var(--muted)}
.empty img{width:70px;height:auto;display:block;margin:0 auto 12px}
.empty h2{font-size:26px;font-weight:600;color:var(--teal);margin-bottom:6px}

.foot{background:var(--beige);border-top:1px solid var(--line)}
.foot .wrap{padding-block:24px 40px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;font-size:15px;color:var(--muted)}
.terms{max-width:62ch;line-height:1.7}.terms small{opacity:.8}
.join{display:inline-flex;align-items:center;gap:8px;background:var(--mint);color:var(--ink);text-decoration:none;border-radius:999px;padding:9px 20px;font-weight:600}

.adminbar{background:var(--lilac-soft);border-bottom:1px solid var(--line)}
.adminbar .wrap{padding-block:10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:15px}
.btn{border:0;background:var(--teal);color:var(--teal-ink);border-radius:999px;padding:8px 18px;cursor:pointer;font-weight:600}
.btn.alt{background:var(--paper);color:var(--ink);border:1.5px solid var(--line)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-top:20px;padding:20px;display:grid;gap:14px}
.panel h2{font-size:24px;font-weight:600;color:var(--teal)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label.f{display:grid;gap:4px;font-size:15px;color:var(--muted);min-width:0}
label.f.wide{grid-column:1/-1}
.f input[type=text],.f input[type=url],.f select,.f textarea{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;width:100%;box-sizing:border-box;color:var(--ink)}
.f textarea{min-height:70px;resize:vertical}
.f input[type=file]{font-size:15px;max-width:100%}
.hint{font-size:14px;color:var(--muted)}
.status{font-size:15px;min-height:1.4em}
.status.err{color:var(--danger)} .status.ok{color:var(--ok)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.confirm{background:var(--bg);border:1.5px solid var(--danger);border-radius:8px;padding:10px;display:grid;gap:8px;font-size:15px;margin-top:8px}
@media (prefers-reduced-motion:no-preference){.sheet{transition:transform .15s}.sheet:hover{transform:translateY(-2px)}}
</style>

    (S.settings.groupLink?'<a class="join" href="'+esc(S.settings.groupLink)+'" target="_blank" rel="noopener">להצטרפות לקבוצת המורות בוואטסאפ</a>':'')+'</div></footer>';

function readForm(){
  ["title","cat","kind","use","desc","link"].forEach(function(k){var el=document.getElementById("f-"+k);if(el)ui.form[k]=el.value});
}
function setMsg(m,t){ui.msg=m;ui.msgType=t||"";render()}

function stripSkel(){return document.getElementById("css").textContent}
function buildHtml(state){
  var json=JSON.stringify(state).replace(/</g,"\\u003c");
  var js=document.getElementById("appjs").textContent;
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>'+
    '<title>ספריית חדר הלמידה</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
    '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap">\n'+
    '<style id="css">'+stripSkel()+'</style>\n\n<div id="app" dir="rtl" lang="he"></div>\n\n'+
    '<script type="application/json" id="state">'+json+'<\/script>\n\n<script id="appjs">'+js+'<\/script>\n</body></html>';
}
async function save(state,okMsg){
  if(!art){setMsg("השמירה לא זמינה בתצוגה הזאת.","err");return false}
  try{await art.publish(buildHtml(state));ui.barMsg=ui.barMsg?okMsg:"";setMsg(okMsg,"ok");return true}
  catch(e){
    var c=e&&e.code;ui.busy=false;
    if(c==="conflict")setMsg("הדף עודכן במקביל ונטען מחדש. נסי שוב.","err");
    else if(c==="not_writer"||c==="not_granted"||c==="consent_required"){ui.canEdit=false;render()}
    else if(c==="too_large")setMsg("הדף גדול מדי לשמירה.","err");
    else if(c==="rate_limited")setMsg("יותר מדי שמירות ברצף. חכי דקה ונסי שוב.","err");
    else setMsg("השמירה נכשלה. נסי שוב בעוד רגע.","err");
    return false;
  }
}

var PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
function loadScript(src){return new Promise(function(res,rej){var t=document.createElement("script");t.src=src;t.onload=res;t.onerror=rej;document.head.appendChild(t)})}
async function pdfCover(file){
  if(!window.pdfjsLib){await loadScript(PDFJS+"pdf.min.js");await loadScript(PDFJS+"pdf.worker.min.js")}
  var lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js";
  var doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
  var page=await doc.getPage(1),base=page.getViewport({scale:1}),vp=page.getViewport({scale:600/base.width});
  var cv=document.createElement("canvas");cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
  var ctx=cv.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,cv.width,cv.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  var blob=await new Promise(function(r){cv.toBlob(r,"image/webp",.85)});
  if(!blob||blob.type!=="image/webp")blob=await new Promise(function(r){cv.toBlob(r,"image/jpeg",.85)});
  try{doc.destroy()}catch(e){}
  return blob;
}
function missingCovers(){return S.items.filter(function(i){return i.file&&i.file.id&&!i.cover}).length}
function fileName(it){var n=(it.file&&it.file.name)||it.title||"file";n=String(n).replace(/[\\\/:*?"<>|]+/g," ").trim();return /\.pdf$/i.test(n)?n:n+".pdf"}
async function fetchAsset(id){var r=await fetch("/_blob/"+id);if(!r.ok)throw new Error("fetch "+r.status);return await r.blob()}
async function doDownload(it){
  ui.dling=it.id;ui.dlErr=null;render();
  try{var b=await fetchAsset(it.file.id);await dlNS.save({filename:fileName(it),data:b});ui.dling=null;render()}
  catch(e){ui.dling=null;if(!(e&&e.code==="declined"))ui.dlErr=it.id;render()}
}
async function makeCovers(){
  if(!assets){ui.barMsg="העלאת קבצים לא זמינה בתצוגה הזאת.";ui.msgType="err";render();return}
  var todo=S.items.filter(function(i){return i.file&&i.file.id&&!i.cover});
  var next=JSON.parse(JSON.stringify(S)),done=0,failed=0;ui.busy=true;
  for(var k=0;k<todo.length;k++){
    ui.barMsg="מכינה תמונת כיסוי "+(k+1)+" מתוך "+todo.length+"…";ui.msgType="";render();
    try{var pdf=await fetchAsset(todo[k].file.id);var cov=await pdfCover(pdf);var r=await assets.upload(cov);
      next.items.forEach(function(i){if(i.id===todo[k].id)i.cover=r.id});done++}
    catch(e){failed++}
  }
  if(!done){ui.busy=false;ui.barMsg="לא הצלחתי להכין תמונות כיסוי. אפשר להעלות תמונה ידנית דרך עריכה.";ui.msgType="err";render();return}
  ui.barMsg="נוצרו "+done+" תמונות"+(failed?", "+failed+" לא הצליחו":"")+". שומרת…";render();
  if(!(await save(next,"נשמר."))){ui.barMsg=ui.msg;render()}
}
async function doSave(){
  readForm();var f=ui.form;
  if(!f.title.trim())return setMsg("חסר שם לחומר.","err");
  var pdf=document.getElementById("f-pdf").files[0],cov=document.getElementById("f-cover").files[0];
  var driveId=null;if(f.link&&f.link.trim()){var mm=f.link.match(/\/d\/([\w-]{10,})/)||f.link.match(/[?&]id=([\w-]{10,})/);if(!mm)return setMsg("הקישור לא נראה כמו קישור לקובץ בדרייב.","err");driveId=mm[1]}
  var prev=f.id?S.items.find(function(i){return i.id===f.id}):null;
  if(!driveId&&!(prev&&prev.drive))return setMsg("חסר קישור לקובץ בדרייב.","err");
  if(pdf&&pdf.type!=="application/pdf")return setMsg("הקובץ צריך להיות PDF.","err");
  if(!assets)return setMsg("העלאת קבצים לא זמינה בתצוגה הזאת.","err");
  ui.busy=true;setMsg("מעלה את הקבצים…","");
  try{
    var item=f.id?JSON.parse(JSON.stringify(S.items.find(function(i){return i.id===f.id}))):{id:Math.random().toString(36).slice(2,10),added:new Date().toISOString().slice(0,10)};
    if(driveId)item.drive=driveId;
    if(pdf)item.file={size:pdf.size,name:pdf.name};
    if(!cov&&pdf){setMsg("מכינה תמונת כיסוי מהעמוד הראשון…","");try{cov=await pdfCover(pdf)}catch(err){cov=null}}
    if(cov){var r2=await assets.upload(cov);item.cover=r2.id}
    item.title=f.title.trim();item.cat=f.cat;item.kind=f.kind;item.use=f.use;item.desc=f.desc.trim();
    var next=JSON.parse(JSON.stringify(S));
    if(f.id)next.items=next.items.map(function(i){return i.id===f.id?item:i});else next.items.push(item);
    await save(next,"נשמר. הדף מתעדכן…");
  }catch(e){ui.busy=false;var m=e&&e.code==="too_large"?"הקובץ גדול מדי (עד 20MB).":e&&e.code==="rate_limited"?"יותר מדי העלאות ברצף, חכי דקה.":"ההעלאה נכשלה. בדקי את הקובץ ונסי שוב.";setMsg(m,"err")}
}

app.addEventListener("input",function(e){if(e.target.id==="q"){ui.q=e.target.value;render()}});
app.addEventListener("click",async function(e){
  var d=e.target.closest("[data-dl]");
  if(d){var it=S.items.find(function(i){return i.id===d.dataset.dl});if(it&&it.file&&dlNS){e.preventDefault();if(!ui.dling)doDownload(it)}return}
  var b=e.target.closest("[data-act],[data-cat]");if(!b)return;
  if(b.dataset.cat){ui.filter=b.dataset.cat;render();return}
  var a=b.dataset.act,id=b.dataset.id;
  if(a!=="save"&&a!=="savesettings"){ui.msg="";ui.msgType=""}
  if(a==="enter"){ui.editing=true;render()}
  else if(a==="exit"){ui.editing=false;ui.form=null;ui.settings=false;render()}
  else if(a==="new"){ui.settings=false;ui.form={title:"",cat:CATS[0][0],kind:KINDS[0],use:USES[0],desc:""};render();window.scrollTo(0,0)}
  else if(a==="edit"){var it=S.items.find(function(i){return i.id===id});ui.settings=false;ui.form={id:id,title:it.title,cat:it.cat,kind:it.kind,use:it.use,desc:it.desc,link:it.drive?"https://drive.google.com/file/d/"+it.drive+"/view":""};render();window.scrollTo(0,0)}
  else if(a==="settings"){ui.form=null;ui.settings=true;render()}
  else if(a==="cancel"){ui.form=null;ui.settings=false;render()}
  else if(a==="askdel"){ui.confirmDel=id;render()}
  else if(a==="nodel"){ui.confirmDel=null;render()}
  else if(a==="del"){
    var gone=S.items.find(function(i){return i.id===id});
    var next=JSON.parse(JSON.stringify(S));next.items=next.items.filter(function(i){return i.id!==id});
    if(await save(next,"נמחק.")&&assets&&gone){try{if(gone.file)await assets.delete(gone.file.id);if(gone.cover)await assets.delete(gone.cover)}catch(err){}}
  }
  else if(a==="save"){doSave()}
  else if(a==="covers"){makeCovers()}
  else if(a==="savesettings"){
    var link=document.getElementById("s-link").value.trim();
    if(link&&!/^https:\/\//.test(link))return setMsg("הקישור צריך להתחיל ב-https://","err");
    var next2=JSON.parse(JSON.stringify(S));next2.settings.intro=document.getElementById("s-intro").value.trim();next2.settings.groupLink=link;
    ui.busy=true;save(next2,"נשמר.");
  }
});

render();
(async function(){
  if(!window.claude||!window.claude.use)return;
  try{dlNS=await window.claude.use("downloads")}catch(e){}
  try{
    var user=await window.claude.use("user");
    var ok=user?await user.canEdit():false;
    if(!ok)return;
    art=await window.claude.use("artifact");assets=await window.claude.use("assets");
    if(art){ui.canEdit=true;render()}
  }catch(e){}
})();
})();
